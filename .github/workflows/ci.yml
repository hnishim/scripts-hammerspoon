name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac

      - name: Run repository tests
        run: bash tests/ci_test.sh
